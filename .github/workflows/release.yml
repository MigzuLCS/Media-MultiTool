name: Build & Release Media MultiTool

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup FFmpeg Binaries
        run: |
          python -c "from core.installer import FFmpegInstaller; FFmpegInstaller().download_and_extract()"

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Build Standalone Executable & Portable ZIP
        run: |
          python build_portable.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer (Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MediaMultiTool.iss

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/Media-MultiTool-Windows-x64.zip
            dist/Media-MultiTool-Setup.exe
          generate_release_notes: true

      - name: Upload Artifacts (Manual Run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/') && github.event_name != 'release'"
        with:
          name: Media-MultiTool-Windows-Build
          path: |
            dist/Media-MultiTool-Windows-x64.zip
            dist/Media-MultiTool-Setup.exe
