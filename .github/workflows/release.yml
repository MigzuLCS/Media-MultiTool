name: Build & Release Media MultiTool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Build Standalone Executable & Portable ZIP
        run: |
          python build_portable.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer (Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\MediaMultiTool.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Media-MultiTool-Windows-x64.zip
            dist/Media-MultiTool-Setup.exe
          name: "Media MultiTool ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifacts (Manual Run)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: Media-MultiTool-Windows-Build
          path: |
            dist/Media-MultiTool-Windows-x64.zip
            dist/Media-MultiTool-Setup.exe
